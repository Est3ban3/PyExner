    normal: [-1.0, 0.0]

  outlet:
    type: Transmissive
    polygon:
      - [ 99.875, -0.25]
      - [100.125, -0.25]
      - [100.125,  2.25]
      - [ 99.875,  2.25]
    values: [0.0, 0.0, 0.0, 0.0]
    normal: [1.0, 0.0]
